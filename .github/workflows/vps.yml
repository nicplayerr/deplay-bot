name: root@apolinario VPS 24/7

on:
  schedule:
    - cron: '0 */5 * * *'  # A cada 5 horas
  workflow_dispatch:

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set hostname to apolinario
        run: sudo hostnamectl set-hostname apolinario

      - name: Install prerequisites safely
        run: |
          # Espera qualquer apt/dpkg em execução terminar
          while fuser /var/lib/dpkg/lock >/dev/null 2>&1; do
            echo "Waiting for dpkg lock..."
            sleep 5
          done
          while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
            echo "Waiting for frontend lock..."
            sleep 5
          done

          # Limpa locks órfãos
          sudo rm -f /var/lib/apt/lists/lock
          sudo rm -f /var/lib/dpkg/lock-frontend
          sudo dpkg --configure -a

          # Atualiza e instala pacotes essenciais
          sudo apt update -y
          sudo apt install -y tmate curl unzip sudo net-tools neofetch git python3-pip docker.io

      - name: Create user apolinario with sudo
        run: |
          if ! id -u apolinario >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash apolinario
            echo "apolinario:apolinario" | sudo chpasswd
            sudo usermod -aG sudo apolinario
            echo "apolinario ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/apolinario
          fi

      - name: Run VPS deploy script with auto-answers
        run: |
          export TERM=xterm
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/nicplayerr/deplay-bot.git /opt/deplay-bot
          sudo bash /opt/deplay-bot/install.sh <<EOF
MTM5NzU3MTk0MDc0MjMzMjUzNg.GiYvYN.LPgUmKs8g8jzKWrlID141COi36QXnhHt_wBtek
1405934774853570640
1400920663052783759
y
EOF

      - name: Start tmate session for SSH access
        uses: mxschmitt/action-tmate@v3

      - name: Show Tmate INFO
        run: |
          echo "🔑 tmate SSH session:"
          cat $HOME/.tmate.sock/ssh

      - name: Sleep to keep VPS alive
        run: sleep 18000  # 5 horas
